<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open GitHub org hero v9 dark</title>
  <desc id="desc">Minimal dark-mode showroom hero for xiaojiou176-open with three flagship doors and a simplified atlas structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="doorA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="doorB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#134E4A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="doorC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1560" height="600" rx="40" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="600" rx="40" stroke="#334155" stroke-width="2"/>

  <circle cx="1316" cy="176" r="92" fill="#8B5CF6" fill-opacity="0.12"/>

  <rect x="88" y="74" width="188" height="34" rx="17" fill="#E2E8F0"/>
  <text x="114" y="96" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.7">SHOWROOM PAGE</text>

  <text x="88" y="168" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2.6">XIAOJIOU176-OPEN</text>
  <text x="88" y="246" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">Three flagship doors</text>
  <text x="88" y="306" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700">for the fastest way in.</text>
  <text x="88" y="382" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Then walk the halls and keep the atlas visible.</text>
  <text x="88" y="426" fill="#2DD4BF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">SEATTLE, WA (PT)</text>

  <path d="M578 252C708 252 766 212 876 212" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
  <path d="M578 308C730 308 816 308 1068 308" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
  <path d="M578 364C724 364 834 252 1258 252" stroke="url(#route)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>

  <rect x="876" y="158" width="196" height="110" rx="28" fill="url(#doorA)"/>
  <rect x="1068" y="254" width="196" height="110" rx="28" fill="url(#doorB)"/>
  <rect x="1258" y="154" width="196" height="110" rx="28" fill="url(#doorC)"/>

  <circle cx="876" cy="212" r="8" fill="#14B8A6"/>
  <circle cx="1068" cy="308" r="8" fill="#60A5FA"/>
  <circle cx="1258" cy="252" r="8" fill="#A78BFA"/>

  <text x="908" y="204" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">SOURCEHARBOR</text>
  <text x="908" y="234" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">READ</text>

  <text x="1100" y="300" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">OPENCAMPUS</text>
  <text x="1100" y="330" fill="#CCFBF1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">DECIDE</text>

  <text x="1290" y="200" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">OPENVIBECODING</text>
  <text x="1290" y="230" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ORCHESTRATE</text>
