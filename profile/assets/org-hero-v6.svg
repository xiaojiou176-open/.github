<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open GitHub org hero v6</title>
  <desc id="desc">Editorial showroom hero for xiaojiou176-open with three central doors and a simplified atlas band for the full product universe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="1" stop-color="#EBE0CF"/>
    </linearGradient>
    <linearGradient id="door1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="door2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="door3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1560" height="520" rx="36" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="520" rx="36" stroke="#1C1917" stroke-width="2"/>

  <circle cx="1328" cy="114" r="84" fill="#C4B5FD" fill-opacity="0.4"/>
  <circle cx="1450" cy="210" r="112" fill="#BFDBFE" fill-opacity="0.36"/>
  <circle cx="1248" cy="338" r="104" fill="#99F6E4" fill-opacity="0.34"/>

  <rect x="88" y="78" width="176" height="32" rx="16" fill="#111827"/>
  <text x="112" y="99" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">SHOWROOM PAGE</text>

  <text x="88" y="184" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="700">xiaojiou176-open</text>
  <text x="88" y="258" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">Three doors. Seven halls.</text>
  <text x="88" y="316" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">One visible atlas.</text>
  <text x="90" y="374" fill="#44403C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Open the universe without hitting a repo wall.</text>

  <rect x="812" y="108" width="168" height="208" rx="32" fill="url(#door1)"/>
  <rect x="1002" y="140" width="168" height="176" rx="32" fill="url(#door2)"/>
  <rect x="1192" y="84" width="168" height="232" rx="32" fill="url(#door3)"/>

  <text x="870" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">FRONT</text>
  <text x="1064" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">ROW</text>
  <text x="1242" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">DOORS</text>

  <text x="812" y="404" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">SEVEN PRODUCT HALLS + FULL ATLAS</text>

  <rect x="812" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="896" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="980" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="1064" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="1148" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="1232" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="1316" y="432" width="72" height="36" rx="18" fill="#111827"/>
  <rect x="1400" y="432" width="120" height="36" rx="18" fill="#111827"/>
