<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open GitHub org hero v7</title>
  <desc id="desc">Editorial showroom hero for xiaojiou176-open with a centered three-door composition and atlas band that survive GitHub-scale viewing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="1" stop-color="#EBE0CF"/>
    </linearGradient>
    <linearGradient id="door1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="door2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="door3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1560" height="520" rx="36" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="520" rx="36" stroke="#1C1917" stroke-width="2"/>

  <circle cx="1314" cy="118" r="82" fill="#C4B5FD" fill-opacity="0.38"/>
  <circle cx="1444" cy="198" r="108" fill="#BFDBFE" fill-opacity="0.34"/>
  <circle cx="1210" cy="342" r="104" fill="#99F6E4" fill-opacity="0.32"/>

  <rect x="88" y="72" width="176" height="32" rx="16" fill="#111827"/>
  <text x="112" y="93" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">SHOWROOM PAGE</text>

  <text x="88" y="170" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">xiaojiou176-open</text>
  <text x="88" y="228" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Three doors. Seven halls.</text>
  <text x="88" y="278" fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">One visible atlas.</text>
  <text x="90" y="324" fill="#44403C" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Open the universe without hitting a repo wall.</text>

  <rect x="620" y="144" width="182" height="206" rx="34" fill="url(#door1)"/>
  <rect x="830" y="118" width="182" height="232" rx="34" fill="url(#door2)"/>
  <rect x="1040" y="92" width="182" height="258" rx="34" fill="url(#door3)"/>

  <text x="682" y="384" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">READ</text>
  <text x="886" y="384" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">DECIDE</text>
  <text x="1070" y="384" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">ORCHESTRATE</text>

  <text x="620" y="432" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6">SEVEN PRODUCT HALLS + FULL ATLAS</text>

  <rect x="620" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="718" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="816" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="914" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="1012" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="1110" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="1208" y="456" width="84" height="34" rx="17" fill="#111827"/>
  <rect x="1306" y="456" width="164" height="34" rx="17" fill="#111827"/>
