<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open showroom hero</title>
  <desc id="desc">A richer visual banner for the xiaojiou176-open GitHub org showroom, highlighting three flagship doors, seven product halls, and a visible full atlas.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="26" x2="1224" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091120"/>
      <stop offset="0.45" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panel" x1="70" y1="54" x2="1212" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="teal" x1="922" y1="64" x2="1164" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="blue" x1="842" y1="40" x2="1198" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="violet" x1="900" y1="22" x2="1212" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="24" y="20" width="1232" height="380" rx="34" fill="url(#bg)"/>
  <rect x="54" y="50" width="1172" height="320" rx="28" fill="url(#panel)" stroke="#1F2937"/>

  <circle cx="1032" cy="108" r="126" fill="url(#violet)" fill-opacity="0.22"/>
  <circle cx="1112" cy="240" r="98" fill="url(#blue)" fill-opacity="0.20"/>
  <circle cx="920" cy="280" r="64" fill="url(#teal)" fill-opacity="0.18"/>

  <rect x="92" y="82" width="288" height="34" rx="17" fill="#09111C" stroke="#334155"/>
  <text x="116" y="104" fill="#E2E8F0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">showroom page • 3 flagship doors • full atlas visible</text>

  <text x="92" y="162" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800">xiaojiou176-open</text>
  <text x="92" y="202" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">A public showroom for readable, reviewable, evidence-backed AI products</text>
  <text x="92" y="236" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="600">Start with three flagship doors, then explore seven product halls and the full atlas.</text>

  <rect x="92" y="272" width="188" height="28" rx="14" fill="#111827" stroke="#1F2937"/>
  <rect x="292" y="272" width="172" height="28" rx="14" fill="#111827" stroke="#1F2937"/>
  <rect x="476" y="272" width="220" height="28" rx="14" fill="#111827" stroke="#1F2937"/>
  <text x="118" y="290" fill="#99F6E4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">READ</text>
  <text x="319" y="290" fill="#BFDBFE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">DECIDE</text>
  <text x="501" y="290" fill="#DDD6FE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">ORCHESTRATE</text>

  <rect x="92" y="318" width="220" height="30" rx="15" fill="#0B1220" stroke="#1F2937"/>
  <rect x="326" y="318" width="228" height="30" rx="15" fill="#0B1220" stroke="#1F2937"/>
  <rect x="568" y="318" width="194" height="30" rx="15" fill="#0B1220" stroke="#1F2937"/>
  <text x="116" y="338" fill="#99F6E4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">SOURCEHARBOR • DOOR 1</text>
  <text x="350" y="338" fill="#BFDBFE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CAMPUS-COPILOT • DOOR 2</text>
  <text x="592" y="338" fill="#DDD6FE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CORTEXPILOT • DOOR 3</text>

  <rect x="844" y="98" width="304" height="194" rx="24" fill="#0B1220" fill-opacity="0.82" stroke="#334155"/>
  <text x="870" y="132" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">Showroom map</text>
  <text x="870" y="162" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">7 product halls</text>
  <text x="870" y="184" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">1 full-atlas layer</text>
  <text x="870" y="206" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Task-goal routes for first-time visitors</text>
  <text x="870" y="228" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Flagship reserve kept visible</text>
  <text x="870" y="250" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">Not a repo wall, not a hidden lab notebook</text>

</svg>
