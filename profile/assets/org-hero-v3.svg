<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open showroom hero</title>
  <desc id="desc">A cleaner poster-style hero for the xiaojiou176-open GitHub org page, emphasizing the showroom concept and the three front-row doors.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="36" x2="1204" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1220"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7DF9E4"/>
      <stop offset="1" stop-color="#33D1C6"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C7E1FF"/>
      <stop offset="1" stop-color="#84B6FF"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E0D4FF"/>
      <stop offset="1" stop-color="#BFA8FF"/>
    </linearGradient>
  </defs>

  <rect x="24" y="20" width="1232" height="380" rx="36" fill="url(#bg)"/>
  <circle cx="1018" cy="92" r="118" fill="#7C3AED" fill-opacity="0.16"/>
  <circle cx="1120" cy="236" r="104" fill="#2563EB" fill-opacity="0.16"/>
  <circle cx="936" cy="300" r="72" fill="#14B8A6" fill-opacity="0.14"/>

  <rect x="88" y="78" width="206" height="32" rx="16" fill="#0B1324" stroke="#2B3954"/>
  <text x="112" y="99" fill="#D8E1F1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">showroom page • open universe</text>

  <text x="88" y="162" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800">xiaojiou176-open</text>
  <text x="88" y="212" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="720">Readable, reviewable, evidence-backed AI products</text>
  <text x="88" y="244" fill="#B6C2D4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="560">Start with three flagship doors, then explore the full atlas across seven product halls.</text>

  <text x="88" y="296" fill="#7DF9E4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">FRONT ROW DOORS</text>
  <rect x="88" y="314" width="188" height="34" rx="17" fill="#101A2A"/>
  <rect x="290" y="314" width="196" height="34" rx="17" fill="#101A2A"/>
  <rect x="500" y="314" width="192" height="34" rx="17" fill="#101A2A"/>
  <text x="118" y="336" fill="url(#mint)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">SOURCEHARBOR</text>
  <text x="324" y="336" fill="url(#ice)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">CAMPUS-COPILOT</text>
  <text x="536" y="336" fill="url(#violet)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">CORTEXPILOT</text>

  <rect x="824" y="110" width="320" height="188" rx="26" fill="#0B1324" fill-opacity="0.84" stroke="#2B3954"/>
  <text x="852" y="146" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800">Why start here</text>
  <text x="852" y="182" fill="#D8E1F1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Three doors to the core story.</text>
  <text x="852" y="208" fill="#D8E1F1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Seven halls for the full system.</text>
  <text x="852" y="234" fill="#D8E1F1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Readable routes for first-time visitors.</text>
  <text x="852" y="260" fill="#D8E1F1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Not a repo wall. Not a hidden lab notebook.</text>

</svg>
