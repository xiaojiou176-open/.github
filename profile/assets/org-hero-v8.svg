<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xiaojiou176-open GitHub org hero v8</title>
  <desc id="desc">Showroom poster for xiaojiou176-open, centered on doors and atlas instead of a robotic text layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F1E8"/>
      <stop offset="1" stop-color="#EBDDC9"/>
    </linearGradient>
    <linearGradient id="door1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="door2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="door3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1560" height="520" rx="36" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="520" rx="36" stroke="#1C1917" stroke-width="2"/>

  <circle cx="1310" cy="116" r="84" fill="#C4B5FD" fill-opacity="0.34"/>
  <circle cx="1442" cy="200" r="112" fill="#BFDBFE" fill-opacity="0.30"/>
  <circle cx="1218" cy="342" r="104" fill="#99F6E4" fill-opacity="0.28"/>

  <rect x="88" y="72" width="176" height="32" rx="16" fill="#111827"/>
  <text x="112" y="93" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">SHOWROOM PAGE</text>

  <text x="88" y="168" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2.4">XIAOJIOU176-OPEN</text>
  <text x="88" y="250" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">THREE DOORS.</text>
  <text x="88" y="316" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">SEVEN HALLS.</text>
  <text x="88" y="382" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">ONE VISIBLE ATLAS.</text>

  <rect x="812" y="108" width="186" height="210" rx="38" fill="url(#door1)"/>
  <rect x="1022" y="132" width="186" height="186" rx="38" fill="url(#door2)"/>
  <rect x="1232" y="86" width="186" height="232" rx="38" fill="url(#door3)"/>

  <text x="880" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">READ</text>
  <text x="1092" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">DECIDE</text>
  <text x="1268" y="356" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">ORCHESTRATE</text>

  <text x="812" y="420" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">SEVEN PRODUCT HALLS + FULL ATLAS</text>

  <rect x="812" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="906" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="1000" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="1094" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="1188" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="1282" y="446" width="82" height="34" rx="17" fill="#111827"/>
  <rect x="1376" y="446" width="82" height="34" rx="17" fill="#111827"/>
</svg>
