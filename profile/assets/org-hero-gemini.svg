<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <style>
      /* 极致暗色模式自适应与高对比度控制 */
      :root {
        --text-main: #1f2328;
        --text-sub: #656d76;
        --border: #d0d7de;
        --accent: #0969da;
        --bg: transparent;
        --grid: rgba(31, 35, 40, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-main: #e6edf3;
          --text-sub: #7d8590;
          --border: #30363d;
          --accent: #58a6ff;
          --grid: rgba(230, 237, 243, 0.04);
        }
      }

      /* 排版纪律 */
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .font-mono { font-family: SFMono-Regular, Consolas, monospace; font-size: 11px; }

      /* 建筑学硬线条与物理插槽感 */
      .door-card { fill: transparent; stroke: var(--border); stroke-width: 1; rx: 3; }
      .hard-line { stroke: var(--border); stroke-width: 1; fill: none; }

      /* 硬核数据脉冲与状态灯 */
      .data-pulse {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 80 800;
        animation: hard-pulse 3.5s cubic-bezier(0.8, 0, 0.2, 1) infinite;
      }
      .status-blink { animation: blinker 4s steps(2, start) infinite; }

      @keyframes hard-pulse {
        0% { stroke-dashoffset: 800; opacity: 0; }
        10% { opacity: 1; }
        45% { stroke-dashoffset: 400; }
        55% { stroke-dashoffset: 400; }
        90% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes blinker {
        0%, 90% { fill: var(--accent); }
        95%, 100% { fill: transparent; }
      }
    </style>

    <pattern id="arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#arch-grid)" />

  <g transform="translate(40, 30)" class="font-mono">
    <rect x="0" y="-8" width="8" height="8" class="status-blink" />
    <text x="16" y="0" fill="var(--text-main)" font-weight="bold">[ORG_SHOWROOM]</text>
    <text x="140" y="0" fill="var(--text-sub)">STATUS: PUBLIC_ROUTING_ACTIVE</text>
    <path d="M 0 10 L 720 10" class="hard-line" />
  </g>

  <g transform="translate(40, 75)">
    <rect width="220" height="90" class="door-card" />
    <path d="M 0 26 L 220 26" class="hard-line" />
    <text x="14" y="17" class="font-mono" fill="var(--text-sub)">01 / FRONT_ROW</text>
    <text x="14" y="55" class="font-sans" fill="var(--text-main)" font-weight="600" font-size="16">SourceHarbor</text>
    <text x="14" y="76" class="font-mono" fill="var(--text-sub)">&gt; READ_ARTIFACTS</text>
  </g>

  <g transform="translate(290, 75)">
    <rect width="220" height="90" class="door-card" />
    <path d="M 0 26 L 220 26" class="hard-line" />
    <text x="14" y="17" class="font-mono" fill="var(--text-sub)">02 / FRONT_ROW</text>
    <text x="14" y="55" class="font-sans" fill="var(--text-main)" font-weight="600" font-size="16">OpenCampus</text>
    <text x="14" y="76" class="font-mono" fill="var(--text-sub)">&gt; DECISION_ENGINE</text>
  </g>

  <g transform="translate(540, 75)">
    <rect width="220" height="90" class="door-card" />
    <path d="M 0 26 L 220 26" class="hard-line" />
    <text x="14" y="17" class="font-mono" fill="var(--text-sub)">03 / FRONT_ROW</text>
    <text x="14" y="55" class="font-sans" fill="var(--text-main)" font-weight="600" font-size="16">OpenVibeCoding</text>
    <text x="14" y="76" class="font-mono" fill="var(--text-sub)">&gt; CONTROL_PLANE</text>
  </g>

  <g transform="translate(40, 205)">
    <path d="M 0 0 L 720 0" class="hard-line" opacity="0.4" />
    <path d="M 0 0 L 720 0" class="data-pulse" />
    <text x="0" y="20" class="font-mono" fill="var(--text-sub)">SYS_MSG: Select a door to explore specific proof objects and technical boundaries.</text>
  </g>
</svg>
